<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองห้องพัก - เฮือนกาแฟ & โฮมสเตย์</title>
  <!-- Tailwind CSS CDN สำหรับตกแต่งหน้าตา -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK v2 -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4">

  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-emerald-800 text-white p-6 text-center">
      <h1 class="text-xl font-semibold">🏡 เฮือนกาแฟ & โฮมสเตย์</h1>
      <p class="text-xs text-emerald-200 mt-1">แบบฟอร์มจองห้องพักออนไลน์ (LINE Mini App)</p>
    </div>

    <!-- User Profile Badge -->
    <div id="profile-section" class="flex items-center gap-3 p-4 bg-emerald-50 border-b border-emerald-100">
      <img id="user-picture" src="https://via.placeholder.com/48" alt="Profile" class="w-12 h-12 rounded-full border-2 border-emerald-500 object-cover">
      <div>
        <p class="text-xs text-slate-500">ผู้จอง (LINE Account):</p>
        <p id="user-name" class="font-medium text-emerald-950">กำลังโหลดโปรไฟล์...</p>
      </div>
    </div>

    <!-- Booking Form -->
    <form id="booking-form" class="p-6 space-y-4">
      <!-- Hidden User ID -->
      <input type="hidden" id="user-id" name="userId">

      <!-- Room Selection -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">เลือกประเภทห้องพัก</label>
        <select id="room-type" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" onchange="calculatePrice()">
          <option value="ห้องริมสวน (Garden View)" data-price="1200">ห้องริมสวน (Garden View) - 1,200 บ./คืน</option>
          <option value="ห้องระเบียงดอย (Mountain View)" data-price="1500">ห้องระเบียงดอย (Mountain View) - 1,500 บ./คืน</option>
          <option value="เรือนครอบครัว (Family Villa)" data-price="2800">เรือนครอบครัว (Family Villa) - 2,800 บ./คืน</option>
        </select>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">วันที่เช็คอิน</label>
          <input type="date" id="checkin-date" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" onchange="calculatePrice()">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">วันที่เช็คเอาท์</label>
          <input type="date" id="checkout-date" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" onchange="calculatePrice()">
        </div>
      </div>

      <!-- Guests & Pets Selection -->
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">จำนวนผู้เข้าพัก</label>
                <select id="guest-count" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-emerald-500">
                    <option value="1">1 คน</option>
                    <option value="2" selected>2 คน</option>
                    <option value="3">3 คน</option>
                    <option value="4">4 คนขึ้นไป</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">สัตว์เลี้ยง</label>
                <select id="pet-option" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white text-sm focus:ring-2 focus:ring-emerald-500">
                    <option value="ไม่มี" selected>ไม่มี</option>
                    <option value="มี (น้องหมา/แมว)">มีสัตว์เลี้ยง</option>
                </select>
            </div>
        </div>

      <!-- Phone Number -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ</label>
        <input type="tel" id="user-phone" required placeholder="08x-xxx-xxxx" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <!-- Price Summary -->
      <div class="bg-slate-100 p-4 rounded-xl flex justify-between items-center text-sm">
        <div>
          <p class="text-slate-500 text-xs">จำนวน: <span id="total-nights" class="font-semibold text-slate-700">1</span> คืน</p>
          <p class="font-medium text-slate-800">ยอดรวมทั้งหมด</p>
        </div>
        <div class="text-right">
          <span id="total-price" class="text-xl font-bold text-emerald-700">1,200</span>
          <span class="text-xs text-slate-500"> บาท</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="btn-submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-3 rounded-xl shadow-md transition duration-200">
        ยืนยันการจองห้องพัก
      </button>
    </form>

    <!-- Success Message Container -->
    <div id="success-screen" class="hidden p-8 text-center space-y-4">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl">✓</div>
      <h2 class="text-lg font-bold text-slate-800">บันทึกการจองเรียบร้อย!</h2>
      <p class="text-sm text-slate-600">ระบบได้ส่งข้อมูลเข้าสู่ระบบเรียบร้อยแล้ว แอดมินจะติดต่อกลับเพื่อยืนยันอีกครั้งนะคะ</p>
      <button onclick="liff.closeWindow()" class="mt-4 px-6 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium">ปิดหน้านี้</button>
    </div>
  </div>

  <script>
    // ** จุดที่ต้องมาใส่ค่า LIFF ID ทีหลัง **
    const MY_LIFF_ID = "2011699431-ofJmVtR6"; 
    // ** จุดที่ต้องใส่ Webhook URL ของ n8n ทีหลัง **
    const N8N_BOOKING_WEBHOOK_URL = "https://n8n-production-2789c.up.railway.app/webhook/line-booking";

    // ตั้งค่าเริ่มต้นวันที่
        const today = new Date().toISOString().split('T')[0];
        const checkinInput = document.getElementById('checkin-date');
        const checkoutInput = document.getElementById('checkout-date');

        checkinInput.min = today;
        checkinInput.value = today;

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];
        checkoutInput.min = tomorrowStr;
        checkoutInput.value = tomorrowStr;

        // เมื่อเปลี่ยนวันเช็คอิน ให้ปรับวันเช็คเอาท์อัตโนมัติ
        checkinInput.addEventListener('change', function() {
            const minCheckout = new Date(this.value);
            minCheckout.setDate(minCheckout.getDate() + 1);
            const minCheckoutStr = minCheckout.toISOString().split('T')[0];
            checkoutInput.min = minCheckoutStr;
            if (checkoutInput.value <= this.value) {
                checkoutInput.value = minCheckoutStr;
            }
            calculatePrice();
        });

        checkoutInput.addEventListener('change', calculatePrice);
document.getElementById('room-type').addEventListener('change', calculatePrice);

function calculatePrice() {
    const roomSelect = document.getElementById('room-type');
    const pricePerNight = parseInt(roomSelect.options[roomSelect.selectedIndex].getAttribute('data-price')) || 0;

    const checkin = new Date(checkinInput.value);
    const checkout = new Date(checkoutInput.value);

    let diffTime = checkout.getTime() - checkin.getTime();
    let nights = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    if (isNaN(nights) || nights <= 0) nights = 1;

    document.getElementById('total-nights').innerText = nights;
    document.getElementById('total-price').innerText = (pricePerNight * nights).toLocaleString();
}
  
    // เริ่มต้นระบบ LIFF
async function initLIFF() {
    try {
        if (typeof MY_LIFF_ID !== 'undefined' && MY_LIFF_ID !== "YOUR_LIFF_ID_HERE" && MY_LIFF_ID !== "") {
            await liff.init({ liffId: MY_LIFF_ID });
            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('user-name').innerText = profile.displayName;
                document.getElementById('user-id').value = profile.userId;
                if (profile.pictureUrl) {
                    document.getElementById('user-picture').src = profile.pictureUrl;
                }
            } else {
                liff.login();
            }
        } else {
            // โหมดทดสอบเมื่อยังไม่ได้ใส่ LIFF ID
            document.getElementById('user-name').innerText = "ทดสอบ (Browser Test)";
            document.getElementById('user-id').value = "TEST_USER_12345";
        }
    } catch (err) {
        console.error("LIFF Init Error:", err);
        document.getElementById('user-name').innerText = "ผู้ใช้งานทั่วไป";
    }
}

    calculatePrice();
    initLIFF();

    // ฟังก์ชันกดยืนยันการจอง
    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const checkinInput = document.getElementById('checkin-date');
        const checkoutInput = document.getElementById('checkout-date');

        if (new Date(checkinInput.value) >= new Date(checkoutInput.value)) {
            alert("วันเช็คเอาท์ต้องมาหลังวันเช็คอินอย่างน้อย 1 วันครับ");
            return;
        }
      const btn = document.getElementById('btn-submit');
      btn.innerText = "กำลังบันทึกข้อมูล...";
      btn.disabled = true;

      const payload = {
            userId: document.getElementById('user-id').value,
            userName: document.getElementById('user-name').innerText,
            roomType: document.getElementById('room-type').value,
            checkin: document.getElementById('checkin-date').value,
            checkout: document.getElementById('checkout-date').value,
            guests: document.getElementById('guest-count').value,
            pets: document.getElementById('pet-option').value,
            phone: document.getElementById('user-phone').value,
            nights: document.getElementById('total-nights').innerText,
            totalPrice: document.getElementById('total-price').innerText.replace(/,/g, '')
        };

      try {
        if (N8N_BOOKING_WEBHOOK_URL !== "YOUR_N8N_WEBHOOK_URL_HERE") {
          await fetch(N8N_BOOKING_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        document.getElementById('booking-form').classList.add('hidden');
        document.getElementById('profile-section').classList.add('hidden');
        document.getElementById('success-screen').classList.remove('hidden');
      } catch (error) {
        alert("เกิดข้อผิดพลาดในการส่งข้อมูล กรุณาลองใหม่อีกครั้ง");
        btn.innerText = "ยืนยันการจองห้องพัก";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
